              example:
                message: Tidak dapat menyetujui pemesanan karena kamar sudah terisi oleh penyewa lain.
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  # ---------------------------------------------------------------------------
  # Reviews (Ulasan)
  # ---------------------------------------------------------------------------
  /kos/{id}/reviews:
    parameters:
      - name: id
