        description: ID properti kos
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Reviews (Ulasan)
      summary: Daftar Ulasan Kos
      description: Menampilkan daftar ulasan dan penilaian bintang dari penyewa pada properti kos tertentu.
      operationId: listReviewsByKos
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          example: 10
      responses:
        '200':
          description: Daftar ulasan berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
