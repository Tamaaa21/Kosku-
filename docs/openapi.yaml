        description: ID transaksi pemesanan
        schema:
          type: integer
        example: 78
    get:
      tags:
        - Bookings (Pemesanan)
      summary: Rincian Detail Pemesanan
      description: Mengambil data transaksi pemesanan lengkap beserta objek penyewa, kos, kamar, dan ulasan.
      operationId: getBookingById
      responses:
        '200':
          description: Data pemesanan ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /bookings/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        description: ID transaksi pemesanan
        schema:
          type: integer
        example: 78
    patch:
      tags:
        - Bookings (Pemesanan)
      summary: Transisi Status Pemesanan (Aksi Non-CRUD)
      description: Menyetujui atau menolak pesanan oleh pemilik/admin, atau membatalkan pesanan oleh pencari. Otomatis menyinkronkan status keterisian kamar secara atomik.
      operationId: updateBookingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
