openapi: 3.1.0
info:
  title: KosKu REST API
  version: 1.0.0
  description: |
    Spesifikasi RESTful API untuk platform pencarian dan manajemen indekos **KosKu**.
    Memfasilitasi pencari hunian sewa, mitra pemilik kos, dan administrator platform.
  contact:
    name: Tim Pengembang KosKu
    email: sigitpratamaaa21@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.kosku.id/api/v1
    description: Server Produksi
  - url: http://127.0.0.1:8000/api/v1
    description: Server Pengembangan Lokal

security:
  - bearerAuth: []

tags:
  - name: Authentication & Profile
    description: Pengelolaan akun, login, logout, dan profil pengguna.
  - name: Properties (Kos)
    description: Pencarian, katalog, dan manajemen properti indekos.
  - name: Rooms (Kamar)
    description: Pengelolaan unit kamar dalam suatu kos.
  - name: Bookings (Pemesanan)
    description: Alur pengajuan sewa, persetujuan, penolakan, dan pembatalan kamar.
  - name: Reviews (Ulasan)
    description: Penilaian rating dan komentar dari penyewa terverifikasi.
  - name: Facilities (Fasilitas)
    description: Master fasilitas bersama untuk properti kos.
  - name: Media Upload
    description: Pengunggahan berkas gambar foto kos dan kamar.
  - name: Admin Moderation
    description: Panel kontrol admin untuk moderasi akun, kos, dan statistik platform.

paths:
  # ---------------------------------------------------------------------------
  # Authentication & Profile
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags:
        - Authentication & Profile
      summary: Registrasi Akun Pengguna Baru
      description: Mendaftarkan akun baru ke platform sebagai pencari atau pemilik kos.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama
                - email
                - password
                - password_confirmation
              properties:
                nama:
                  type: string
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  example: budi.santoso@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: Password123!
                password_confirmation:
                  type: string
                  format: password
                  example: Password123!
                telepon:
                  type:
                    - string
                    - "null"
                  example: "081234567890"
                role:
                  type: string
                  enum: [pencari, pemilik]
                  default: pencari
                  example: pencari
      responses:
        '201':
          description: Akun berhasil didaftarkan dan token diterbitkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registrasi berhasil.
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: 1|kYx9A12345...
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication & Profile
      summary: Masuk dan Terbitkan Token
      description: Otentikasi kredensial email dan password untuk mendapatkan Sanctum Bearer Token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: budi.santoso@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login berhasil.
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: 2|mNz8B67890...
        '403':
          description: Akun dinonaktifkan oleh administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Akun Anda dinonaktifkan oleh administrator.
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication & Profile
      summary: Keluar / Revoke Token
      description: Menghapus token otentikasi aktif yang sedang digunakan.
      operationId: logoutUser
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout berhasil.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /me:
    get:
      tags:
        - Authentication & Profile
      summary: Detail Profil Pengguna Aktif
      description: Mengambil data pengguna yang saat ini sedang login berdasarkan Bearer token.
      operationId: getCurrentUser
      responses:
        '200':
          description: Profil pengguna berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    put:
      tags:
        - Authentication & Profile
      summary: Perbarui Profil Pengguna
      description: Mengubah nama lengkap atau nomor telepon pengguna yang sedang login.
      operationId: updateCurrentUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Budi Santoso Wijaya
                telepon:
                  type:
                    - string
                    - "null"
                  example: "089876543210"
                foto:
                  type:
                    - string
                    - "null"
                  format: uri
                  example: https://api.kosku.id/storage/avatars/user1.webp
      responses:
        '200':
          description: Profil berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profil berhasil diperbarui.
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /me/avatar:
    post:
      tags:
        - Authentication & Profile
      summary: Unggah Foto Profil (Avatar)
      description: Mengunggah berkas foto profil baru (maksimal 2MB, format JPG/PNG/WEBP).
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - foto
              properties:
                foto:
                  type: string
                  format: binary
                  description: Berkas gambar foto profil
      responses:
        '200':
          description: Foto profil berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Foto profil berhasil diperbarui.
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /me/password:
    put:
      tags:
        - Authentication & Profile
      summary: Perbarui Kata Sandi
      description: Memperbarui kata sandi akun dengan memverifikasi kata sandi lama terlebih dahulu.
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                  example: PasswordLama123!
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: PasswordBaru123!
                password_confirmation:
                  type: string
                  format: password
                  example: PasswordBaru123!
      responses:
        '200':
          description: Kata sandi berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kata sandi berhasil diperbarui.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  # ---------------------------------------------------------------------------
  # Properties (Kos)
  # ---------------------------------------------------------------------------
  /kos:
    get:
      tags:
        - Properties (Kos)
      summary: Katalog Properti Kos (Pencarian & Filter)
      description: Menampilkan daftar properti indekos dengan dukungan query pencarian teks, filter spesifikasi, pengurutan, dan paginasi.
      operationId: listKos
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SearchQueryParam'
        - name: lokasi
          in: query
          description: Filter alamat atau wilayah kota
          schema:
            type: string
          example: Sleman
        - name: harga_min
          in: query
          description: Batas minimum tarif bulanan dasar
          schema:
            type: integer
            minimum: 0
          example: 500000
        - name: harga_max
          in: query
          description: Batas maksimum tarif bulanan dasar
          schema:
            type: integer
            minimum: 0
          example: 2000000
        - name: jenis
          in: query
          description: Kategori jenis penghuni kos
          schema:
            type: string
            enum: [putra, putri, campur]
          example: campur
        - name: fasilitas
          in: query
          description: Array ID fasilitas (harus memiliki seluruh fasilitas terpilih)
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: tersedia
          in: query
          description: Hanya tampilkan kos yang memiliki kamar berstatus tersedia
          schema:
            type: boolean
          example: true
        - name: pemilik_id
          in: query
          description: Filter kos milik mitra pemilik tertentu
          schema:
            type: integer
          example: 2
        - name: sort
          in: query
          description: Pengurutan data katalog kos
          schema:
            type: string
            enum: [latest, harga_asc, harga_desc, id_asc]
            default: latest
          example: harga_asc
      responses:
        '200':
          description: Katalog kos berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kos'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Parameter query filter atau paginasi tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Kesalahan internal server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Properties (Kos)
      summary: Daftarkan Properti Kos Baru
      description: Menambahkan data kos baru oleh mitra pemilik kos. Dilengkapi geocoding otomatis jika koordinat dikosongkan.
      operationId: createKos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama
                - alamat
                - jenis
                - harga
              properties:
                nama:
                  type: string
                  example: Kos Graha Melati Harmoni
                alamat:
                  type: string
                  example: Jl. Kaliurang KM 5 No. 12, Sleman, Yogyakarta
                deskripsi:
                  type:
                    - string
                    - "null"
                  example: Kos nyaman dengan suasana asri dekat kampus UGM.
                jenis:
                  type: string
                  enum: [putra, putri, campur]
                  example: campur
                harga:
                  type: integer
                  minimum: 0
                  example: 1500000
                harga_harian:
                  type:
                    - integer
                    - "null"
                  example: 120000
                harga_mingguan:
                  type:
                    - integer
                    - "null"
                  example: 450000
                durasi_sewa:
                  type: array
                  items:
                    type: string
                    enum: [harian, mingguan, bulanan]
                  example: [harian, mingguan, bulanan]
                latitude:
                  type:
                    - number
                    - "null"
                  format: float
                  example: -7.7554312
                longitude:
                  type:
                    - number
                    - "null"
                  format: float
                  example: 110.3789123
                peraturan:
                  type: array
                  items:
                    type: string
                  example: ["Dilarang merokok di dalam kamar", "Jam malam tamu pukul 22:00 WIB"]
                foto:
                  type: array
                  items:
                    type: string
                    format: uri
                  example: ["https://api.kosku.id/storage/uploads/graha_front.webp"]
                fasilitas_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
      responses:
        '201':
          description: Data properti kos berhasil ditambahkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kos berhasil ditambahkan.
                  data:
                    $ref: '#/components/schemas/Kos'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /kos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik properti kos
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Properties (Kos)
      summary: Detail Properti Kos
      description: Menampilkan rincian lengkap kos beserta relasi pemilik, fasilitas, daftar kamar, dan ulasan.
      operationId: getKosById
      security: []
      responses:
        '200':
          description: Data kos ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Kos'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    put:
      tags:
        - Properties (Kos)
      summary: Perbarui Data Properti Kos
      description: Memperbarui spesifikasi, tarif, aturan, atau fasilitas properti kos oleh pemilik atau admin.
      operationId: updateKos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Kos Graha Melati Harmoni
                alamat:
                  type: string
                  example: Jl. Kaliurang KM 5 No. 12, Sleman
                deskripsi:
                  type:
                    - string
                    - "null"
                jenis:
                  type: string
                  enum: [putra, putri, campur]
                harga:
                  type: integer
                  minimum: 0
                harga_harian:
                  type:
                    - integer
                    - "null"
                harga_mingguan:
                  type:
                    - integer
                    - "null"
                durasi_sewa:
                  type: array
                  items:
                    type: string
                peraturan:
                  type: array
                  items:
                    type: string
                foto:
                  type: array
                  items:
                    type: string
                fasilitas_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Data kos berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kos berhasil diperbarui.
                  data:
                    $ref: '#/components/schemas/Kos'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

    delete:
      tags:
        - Properties (Kos)
      summary: Hapus Properti Kos
      description: Menghapus data properti kos oleh pemilik kos terkait atau administrator.
      operationId: deleteKos
      responses:
        '200':
          description: Data kos berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kos berhasil dihapus.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  # ---------------------------------------------------------------------------
  # Rooms (Kamar)
  # ---------------------------------------------------------------------------
  /kos/{id}/rooms:
    parameters:
      - name: id
        in: path
        required: true
        description: ID properti kos
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Rooms (Kamar)
      summary: Daftar Kamar dalam Kos
      description: Mengambil seluruh unit kamar yang dimiliki oleh properti kos tertentu.
      operationId: listRoomsByKos
      security: []
      responses:
        '200':
          description: Daftar kamar berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    post:
      tags:
        - Rooms (Kamar)
      summary: Tambah Unit Kamar Baru
      description: Menambahkan unit kamar baru ke dalam kos oleh pemilik kos terkait.
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama_kamar
                - harga
              properties:
                nama_kamar:
                  type: string
                  example: Kamar 01 - Lantai 1
                harga:
                  type: integer
                  minimum: 0
                  example: 1500000
                harga_harian:
                  type:
                    - integer
                    - "null"
                  example: 120000
                harga_mingguan:
                  type:
                    - integer
                    - "null"
                  example: 450000
                durasi_sewa:
                  type: array
                  items:
                    type: string
                  example: [harian, bulanan]
                status:
                  type: string
                  enum: [tersedia, terisi]
                  default: tersedia
                  example: tersedia
                ukuran:
                  type:
                    - string
                    - "null"
                  example: 3.5 x 4 m
                foto:
                  type: array
                  items:
                    type: string
                    format: uri
                  example: ["https://api.kosku.id/storage/uploads/room_101.webp"]
                fasilitas_kamar:
                  type: array
                  items:
                    type: string
                  example: ["Kamar Mandi Dalam", "AC", "Kasur Springbed"]
      responses:
        '201':
          description: Kamar berhasil ditambahkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kamar berhasil ditambahkan.
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unit kamar
        schema:
          type: integer
        example: 101
    put:
      tags:
        - Rooms (Kamar)
      summary: Perbarui Data Kamar
      description: Memperbarui spesifikasi atau status ketersediaan kamar. Status tidak dapat diubah menjadi tersedia jika sedang memiliki sewa aktif.
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama_kamar:
                  type: string
                harga:
                  type: integer
                harga_harian:
                  type:
                    - integer
                    - "null"
                harga_mingguan:
                  type:
                    - integer
                    - "null"
                durasi_sewa:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [tersedia, terisi]
                ukuran:
                  type:
                    - string
                    - "null"
                foto:
                  type: array
                  items:
                    type: string
                fasilitas_kamar:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Data kamar berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Data kamar berhasil diperbarui.
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

    delete:
      tags:
        - Rooms (Kamar)
      summary: Hapus Unit Kamar
      description: Menghapus unit kamar. Ditolak jika kamar sedang dalam proses sewa aktif (menunggu atau disetujui).
      operationId: deleteRoom
      responses:
        '200':
          description: Kamar berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kamar berhasil dihapus.
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  # ---------------------------------------------------------------------------
  # Bookings (Pemesanan)
  # ---------------------------------------------------------------------------
  /bookings:
    get:
      tags:
        - Bookings (Pemesanan)
      summary: Riwayat & Daftar Pemesanan Sewa
      description: Mengambil daftar pemesanan sewa kamar. Data terfilter otomatis berdasarkan peran aktor (pencari, pemilik kos terkait, atau admin).
      operationId: listBookings
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: per_page
          in: query
          description: Jumlah transaksi per halaman
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          example: 50
        - $ref: '#/components/parameters/SearchQueryParam'
        - name: status
          in: query
          description: Filter status pemesanan
          schema:
            type: string
            enum: [all, menunggu, disetujui, ditolak, dibatalkan, selesai]
            default: all
          example: menunggu
        - name: periode
          in: query
          description: Filter rentang waktu transaksi sewa
          schema:
            type: string
            enum: [all, today, 7d, 30d]
            default: all
          example: 7d
        - name: sort
          in: query
          description: Pengurutan data pemesanan
          schema:
            type: string
            enum: [latest, id_asc]
            default: latest
          example: latest
      responses:
        '200':
          description: Daftar pemesanan berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

    post:
      tags:
        - Bookings (Pemesanan)
      summary: Ajukan Pemesanan Sewa Baru
      description: Mengajukan sewa kamar oleh pencari kos. Dilengkapi transaksi atomik pesimistic lock untuk mencegah kondisi double-booking.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kamar_id
                - tanggal_pemesanan
              properties:
                kamar_id:
                  type: integer
                  example: 101
                tanggal_pemesanan:
                  type: string
                  format: date
                  example: "2026-11-01"
                durasi_tipe:
                  type: string
                  enum: [harian, mingguan, bulanan]
                  default: bulanan
                  example: bulanan
                durasi_jumlah:
                  type: integer
                  minimum: 1
                  default: 1
                  example: 3
      responses:
        '201':
          description: Pemesanan berhasil diajukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pemesanan berhasil diajukan.
                  data:
                    $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          description: Kamar tidak tersedia atau sedang dalam proses sewa aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Kamar tidak tersedia atau sedang dalam proses pemesanan.
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /bookings/{id}:
