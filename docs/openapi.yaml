        '404':
          $ref: '#/components/responses/NotFoundResponse'

# -----------------------------------------------------------------------------
# Components (Schemas, Parameters, Responses, SecuritySchemes)
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan Bearer token yang diperoleh dari endpoint `/auth/login` atau `/auth/register`.

  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman paginasi
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1

    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman
      schema:
        type: integer
        default: 12
        minimum: 1
        maximum: 100
      example: 12

    SearchQueryParam:
      name: q
      in: query
      description: Kata kunci pencarian teks bebas
      schema:
        type: string
      example: Graha Melati

  responses:
    UnauthorizedResponse:
      description: Permintaan tidak terotentikasi (Token tidak disertakan atau tidak valid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.

    ForbiddenResponse:
      description: Akses ditolak karena role atau kebijakan otorisasi tidak mencukupi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Anda tidak memiliki wewenang untuk mengakses aksi ini.

    NotFoundResponse:
      description: Data resource yang diminta tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: No query results for model.

    ValidationErrorResponse:
      description: Validasi input data formulir gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The given data was invalid.
            errors:
              email:
                - Format email tidak valid.
                - Email sudah terdaftar dalam sistem.

  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Pesan deskripsi kesalahan
          example: Terjadi kesalahan pada permintaan Anda.

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            kamar_id:
              - Unit kamar wajib dipilih.
            tanggal_pemesanan:
              - Tanggal sewa harus hari ini atau yang akan datang.

    User:
      type: object
      required:
        - id
        - nama
        - email
        - role
        - aktif
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi.santoso@example.com
        telepon:
          type:
            - string
            - "null"
          example: "081234567890"
        no_hp:
          type:
            - string
            - "null"
          example: "081234567890"
        foto:
          type:
            - string
            - "null"
          format: uri
          example: https://api.kosku.id/storage/avatars/budi.webp
        role:
          type: string
          enum: [pencari, pemilik, admin]
          example: pencari
        aktif:
          type: boolean
          example: true
        kos_count:
          type: integer
          example: 3
        pemesanan_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
          example: "2026-10-20T08:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-20T08:00:00.000000Z"

    Kos:
      type: object
      required:
        - id
        - pemilik_id
        - nama
        - alamat
        - jenis
        - harga
      properties:
        id:
          type: integer
          example: 1
        pemilik_id:
          type: integer
          example: 2
        nama:
          type: string
          example: Kos Graha Melati Harmoni
        alamat:
          type: string
          example: Jl. Kaliurang KM 5 No. 12, Sleman, Yogyakarta
        deskripsi:
