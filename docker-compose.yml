services:
  # -------------------------------------------------------------
  # Laravel 11 Backend (PHP 8.3-FPM)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosku-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      - APP_NAME=${APP_NAME:-KosKu}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=mariadb
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-kosku}
      - DB_USERNAME=${DB_USERNAME:-kosku}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - RUN_SEEDER=${RUN_SEEDER:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kosku-network

  # -------------------------------------------------------------
  # Nginx Web Server + Vue 3 Frontend SPA
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
    container_name: kosku-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - kosku-network

  # -------------------------------------------------------------
  # MariaDB Database
  # -------------------------------------------------------------
  db:
    image: mariadb:11.4
    container_name: kosku-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kosku}
      MYSQL_USER: ${DB_USERNAME:-kosku}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kosku-network

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  kosku-network:
    driver: bridge
